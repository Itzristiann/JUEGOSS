const $=id=>document.getElementById(id),C=$('c').getContext('2d'),W=10,H=22,R=n=>Math.random()*n|0,mkB=()=>Array.from({length:H},()=>new Uint8Array(W));

let gm='online',sel=0,score=0,dp=-1,cur=-1,PS=[],RG=[],TF='#40FFC2',CU=[],B,pc,hold,canHold,NQ=[],bag=[],st='menu',time=0,lvl=1,q=0,cmb=-1,b2b=0,ups=0,ko=0,lines=0,mode=2,tgt=null,lastAtk=null,lastRot=0,lock=0,rs=0,acc=0,dasT=0,sq=0,sh=0,alive=98,tt=0,warn=0,PA=[],PJ=[],TX=[],FL=[],hs={L:0,R:0,D:0},mute=0,AC,gh=0;
/* ---------- audio ---------- */

/* ---------- piezas ---------- */
const pull=()=>{if(!bag.length){bag=[0,1,2,3,4,5,6];for(let i=6;i>0;i--){const j=R(i+1);[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()};
const nextP=()=>{const t=NQ.length?NQ.shift():pull();while(NQ.length<6)NQ.push(pull());return t};
const hit=(p,b=B)=>SH[p.t].o[p.r].some(([a,c])=>{const X=p.x+a,Y=p.y+c;return X<0||X>=W||Y>=H||(Y>=0&&b[Y][X])});

function mv(d){const n={...pc,x:pc.x+d};if(!hit(n)){pc=n;lastRot=0;touch();sfx(300,.04,'square',.03)}}

function part(x,y,c,n,sp=300,s=6,l=.8){if(gm=='duel'&&cur>=0){x=x*.9+(cur?617:-425);y=y*.9+55}for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*sp;PA.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.2,l,m:l,c,s:s*(.4+Math.random())})}if(PA.length>1600)PA.splice(0,PA.length-1600)}

const gS=()=>[B,pc,hold,canHold,NQ,bag,q,cmb,b2b,lock,rs,acc,lastRot,hs,dasT,sq,gh,lines,score];
function sS(a){[B,pc,hold,canHold,NQ,bag,q,cmb,b2b,lock,rs,acc,lastRot,hs,dasT,sq,gh,lines,score]=a}

sh=Math.max(sh,n*3);boom(960,58+(rows[0]-2)*48+24,n==4?'#FFE82E':COL[pc.t+1],60+n*40);sfx(n==4?880:520+n*90,n==4?.5:.25,'square',.08,2);if(n==4)sfx(220,.5,'sawtooth',.08,3)}

if(atk>0)send(atk);
if(!n&&q>0){const g=Math.min(q,8);q-=g;garb(g)}
canHold=1;if(cur==1)AI.tx=null;if(st=='play')spawn(nextP())}
function garb(n){if(!(Math.random()<.75))gh=R(W);const rm=B.splice(0,n);for(let i=0;i<n;i++){const r=new Uint8Array(W).fill(8);r[gh]=0;B.push(r)}sh=8;sfx(90,.3,'sawtooth',.14,.4);if(rm.some(r=>r.some(v=>v)))die()}
function send(n){if(gm=='duel'){const j=1-cur;shoot(cur?1481:439,700,j?1481:439,500,'#FFF04A',()=>{PS[j][6]=Math.min(20,PS[j][6]+n);sfx(200,.25,'sawtooth',.08,.5)});return}if(!OPV())return;tgt=pick();if(!tgt)return;const o=tgt;shoot(960,880,o.x+32,o.y+62,'#FFF04A',()=>{if(o.alive){o.q=Math.min(30,o.q+n);o.hit=time;o.rev=1}});sfx(700,.2,'sawtooth',.05,2)}
/* ---------- rivales ---------- */
const OP=Array.from({length:99},(_,i)=>{const k=i%49;return{sx:(i<49?16:1402)+73*(k%7),sy:50+143*(k/7|0),res:i>97}});

function oLock(o){const h=Array(10).fill(0);for(let c=0;c<10;c++)for(let y=0;y<20;y++)if(o.b[y][c]){h[c]=20-y;break}

if(n){o.b=o.b.filter(r=>!r.every(v=>v));while(o.b.length<20)o.b.unshift(new Uint8Array(10));sendO(o,[0,0,1,2,4][Math.min(n,4)])}
else if(o.q>0){const g=Math.min(o.q,6);o.q-=g;if(Math.random()<.2)o.gh=R(10);const rm=o.b.splice(0,g);for(let i=0;i<g;i++){const r=new Uint8Array(10).fill(8);r[o.gh]=0;o.b.push(r)}if(rm.some(r=>r.some(v=>v)))kill(o)}}

else shoot(o.x+32,o.y+62,z.x+32,z.y+62,'#FF9A3C',()=>{z.q=Math.min(30,z.q+n)})}

/* ---------- fin de partida ---------- */
