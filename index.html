<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade: Pacman vs Dino</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin: 30px 0 10px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        p {
            color: #aaa;
            margin-top: 5px;
        }

        .menu-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-juego {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px 30px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-juego:hover {
            transform: translateY(-3px);
            border-color: #f1c40f;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3);
        }

        .btn-juego.pacman:hover {
            border-color: #f1c40f;
            color: #f1c40f;
        }

        .btn-juego.dino:hover {
            border-color: #2ecc71;
            color: #2ecc71;
        }

        .game-viewport {
            width: 100%;
            max-width: 900px;
            height: 600px;
            background-color: #000;
            border: 3px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .placeholder {
            color: #666;
            font-size: 1.2rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Arcade Retro</h1>
        <p>Selecciona un juego para empezar</p>
    </header>

    <div class="menu-container">
        <button class="btn-juego pacman" onclick="cargarJuego('pacman/index.html')">🕹️ Jugar Pacman</button>
        <button class="btn-juego dino" onclick="cargarJuego('dino/index.html')">🦖 Jugar Dinosaurio</button>
    </div>

    <div class="game-viewport">
        <iframe id="pantalla-juego" src="pacman/index.html"></iframe>
    </div>

    <script>
        function cargarJuego(ruta) {
            const iframe = document.getElementById('pantalla-juego');
            iframe.src = ruta;
            
            // Le da el foco al iframe para que detecte las teclas de flechas/espacio de inmediato
            iframe.onload = function() {
                iframe.contentWindow.focus();
            };
        }
    </script>
</body>
</html>
